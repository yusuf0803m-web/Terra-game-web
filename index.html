<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/Terra-game-web/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Terra Game - game sandbox 2D yang bisa dimainkan di browser.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Terra Game">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Terra Game</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #fff;
      font: 16px sans-serif; gap: 12px; }
    #loading .bar { width: 200px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
    #loading .bar i { display: block; width: 40%; height: 100%; background: #6fc04a;
      animation: slide 1s infinite ease-in-out alternate; }
    @keyframes slide { from { margin-left: 0 } to { margin-left: 60% } }
  </style>
</head>
<body>
  <div id="loading"><div>Terra Game</div><div class="bar"><i></i></div><div>Memuat...</div></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Sembunyikan layar muat setelah Flutter menggambar frame pertama.
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loading');
      if (l) l.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
